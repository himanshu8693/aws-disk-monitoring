[defaults]
inventory      = ./inventory/accounts
roles_path     = ./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
result_format    = yaml
interpreter_python = auto_silent

# privilege escalation — ssm-user has passwordless sudo on managed instances
become        = false
become_method = sudo
become_user   = root
become_ask_pass = false

# macOS workaround: the SSM connection plugin opens a subprocess (aws ssm start-session)
# whose file descriptors are inherited across fork() calls in Ansible workers, causing
# "A worker was found in a dead state" crashes. Disabling pipelining ensures each task
# gets a clean connection without persistent FD inheritance.
# Production Linux control nodes can safely re-enable pipelining.
[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
pipelining = False
