---
# Creates CloudWatch alarms and SNS topics in the MONITORING account.
#
# Alarm placement: all alarms (per-instance and composite) live in the monitoring account,
# watching metrics that OAM makes readable there from source accounts.
# CloudWatch composite alarms can only reference alarms in the same account+region,
# so this is a hard requirement — not a design preference.
#
# Cross-account metric source:
# Per-instance alarms use the metrics[] / MetricDataQuery structure so that
# account_id (the source AWS account) is expressed at the MetricDataQuery level,
# which is the correct CloudWatch cross-account alarm mechanism. Using AccountId
# as a metric dimension is NOT the correct mechanism and is not used here.
#
# SINGLE-ACCOUNT MODE: when monitoring_account_id == source account_id,
# the account_id field is omitted from the MetricDataQuery — CloudWatch rejects it
# when the alarm and metric are in the same account.

- name: collect unique regions from inventory
  ansible.builtin.set_fact:
    monitoring_regions: >-
      {{
        groups['all'] | default([]) |
        map('extract', hostvars, 'ansible_aws_ssm_region') |
        select('defined') |
        list |
        unique
      }}

- name: ensure SNS topic exists in monitoring account (one per region)
  community.aws.sns_topic:
    name: "{{ sns_topic_name }}"
    display_name: "{{ sns_topic_display_name }}"
    region: "{{ item }}"
    state: present
  loop: "{{ monitoring_regions }}"

# Cross-account alarm: account_id in MetricDataQuery routes via OAM to the source account.
# Used when monitoring account differs from the source (member) account.
- name: create per-instance critical alarm (cross-account)
  amazon.aws.cloudwatch_metric_alarm:
    state: present
    region: "{{ hostvars[item]['ansible_aws_ssm_region'] }}"
    name: "disk-critical-{{ hostvars[item]['account_id'] }}-{{ item }}"
    metrics:
      - id: disk_used
        account_id: "{{ hostvars[item]['account_id'] }}"
        metric_stat:
          metric:
            namespace: "{{ cloudwatch_namespace }}"
            metric_name: DiskUsedPercent
            dimensions:
              - name: InstanceId
                value: "{{ item }}"
          period: 60
          stat: Average
          unit: Percent
        return_data: true
    comparison: "GreaterThanOrEqualToThreshold"
    threshold: "{{ hostvars[item]['disk_alert_critical_percent'] | default(disk_alert_critical_percent) | float }}"
    evaluation_periods: "{{ disk_alert_evaluation_minutes }}"
    treat_missing_data: breaching
    description: >-
      DiskUsedPercent >= {{ hostvars[item]['disk_alert_critical_percent'] | default(disk_alert_critical_percent) }}%
      on {{ item }} (source account {{ hostvars[item]['account_id'] }}, monitored via OAM).
      treat_missing_data=breaching: a dead agent fires the alarm rather than staying green.
    alarm_actions:
      - "arn:aws:sns:{{ hostvars[item]['ansible_aws_ssm_region'] }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
    ok_actions:
      - "arn:aws:sns:{{ hostvars[item]['ansible_aws_ssm_region'] }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
    insufficient_data_actions:
      - "arn:aws:sns:{{ hostvars[item]['ansible_aws_ssm_region'] }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
  loop: "{{ groups['all'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item]['account_id'] != monitoring_account_id

# Single-account alarm: no account_id in MetricDataQuery — same-account metrics are local.
- name: create per-instance critical alarm (single-account)
  amazon.aws.cloudwatch_metric_alarm:
    state: present
    region: "{{ hostvars[item]['ansible_aws_ssm_region'] }}"
    name: "disk-critical-{{ hostvars[item]['account_id'] }}-{{ item }}"
    metrics:
      - id: disk_used
        metric_stat:
          metric:
            namespace: "{{ cloudwatch_namespace }}"
            metric_name: DiskUsedPercent
            dimensions:
              - name: InstanceId
                value: "{{ item }}"
          period: 60
          stat: Average
          unit: Percent
        return_data: true
    comparison: "GreaterThanOrEqualToThreshold"
    threshold: "{{ hostvars[item]['disk_alert_critical_percent'] | default(disk_alert_critical_percent) | float }}"
    evaluation_periods: "{{ disk_alert_evaluation_minutes }}"
    treat_missing_data: breaching
    description: >-
      DiskUsedPercent >= {{ hostvars[item]['disk_alert_critical_percent'] | default(disk_alert_critical_percent) }}%
      on {{ item }} (single-account mode — alarm and metric in same account).
      treat_missing_data=breaching: a dead agent fires the alarm rather than staying green.
    alarm_actions:
      - "arn:aws:sns:{{ hostvars[item]['ansible_aws_ssm_region'] }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
    ok_actions:
      - "arn:aws:sns:{{ hostvars[item]['ansible_aws_ssm_region'] }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
    insufficient_data_actions:
      - "arn:aws:sns:{{ hostvars[item]['ansible_aws_ssm_region'] }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
  loop: "{{ groups['all'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item]['account_id'] == monitoring_account_id

- name: create per-instance warning alarm (cross-account)
  amazon.aws.cloudwatch_metric_alarm:
    state: present
    region: "{{ hostvars[item]['ansible_aws_ssm_region'] }}"
    name: "disk-warning-{{ hostvars[item]['account_id'] }}-{{ item }}"
    metrics:
      - id: disk_used
        account_id: "{{ hostvars[item]['account_id'] }}"
        metric_stat:
          metric:
            namespace: "{{ cloudwatch_namespace }}"
            metric_name: DiskUsedPercent
            dimensions:
              - name: InstanceId
                value: "{{ item }}"
          period: 60
          stat: Average
          unit: Percent
        return_data: true
    comparison: "GreaterThanOrEqualToThreshold"
    threshold: "{{ hostvars[item]['disk_alert_warning_percent'] | default(disk_alert_warning_percent) | float }}"
    evaluation_periods: "{{ disk_alert_evaluation_minutes }}"
    treat_missing_data: breaching
    description: >-
      DiskUsedPercent >= {{ hostvars[item]['disk_alert_warning_percent'] | default(disk_alert_warning_percent) }}%
      on {{ item }} — warning only, no notification action.
  loop: "{{ groups['all'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item]['account_id'] != monitoring_account_id

- name: create per-instance warning alarm (single-account)
  amazon.aws.cloudwatch_metric_alarm:
    state: present
    region: "{{ hostvars[item]['ansible_aws_ssm_region'] }}"
    name: "disk-warning-{{ hostvars[item]['account_id'] }}-{{ item }}"
    metrics:
      - id: disk_used
        metric_stat:
          metric:
            namespace: "{{ cloudwatch_namespace }}"
            metric_name: DiskUsedPercent
            dimensions:
              - name: InstanceId
                value: "{{ item }}"
          period: 60
          stat: Average
          unit: Percent
        return_data: true
    comparison: "GreaterThanOrEqualToThreshold"
    threshold: "{{ hostvars[item]['disk_alert_warning_percent'] | default(disk_alert_warning_percent) | float }}"
    evaluation_periods: "{{ disk_alert_evaluation_minutes }}"
    treat_missing_data: breaching
    description: >-
      DiskUsedPercent >= {{ hostvars[item]['disk_alert_warning_percent'] | default(disk_alert_warning_percent) }}%
      on {{ item }} — warning only, no notification action (single-account mode).
  loop: "{{ groups['all'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item]['account_id'] == monitoring_account_id

# Build one composite alarm per region.
- name: build composite alarm rule for each region
  ansible.builtin.set_fact:
    composite_rule_for_region: >-
      {%- set ns = namespace(parts=[]) -%}
      {%- for h in groups['all'] | default([]) -%}
        {%- if hostvars[h]['ansible_aws_ssm_region'] == item -%}
          {%- set alarm_name = 'ALARM("disk-critical-' + hostvars[h]['account_id'] + '-' + h + '")' -%}
          {%- set _ = ns.parts.append(alarm_name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.parts | join(' OR ') }}
  register: composite_rule_results
  loop: "{{ monitoring_regions }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    (groups['all'] | default([]) |
     map('extract', hostvars) |
     selectattr('ansible_aws_ssm_region', 'equalto', item) |
     list | length) > 0

- name: create regional composite alarm (fires when any instance in region is critical)
  # amazon.aws.cloudwatch_metric_alarm does not support alarm_rule (composite alarms)
  # at this collection version — use the AWS CLI directly via command module.
  ansible.builtin.command:
    cmd: >
      aws cloudwatch put-composite-alarm
        --region {{ item.item }}
        --alarm-name "fleet-disk-critical-{{ item.item }}"
        --alarm-description "At least one instance in {{ item.item }} has DiskUsedPercent >= critical threshold."
        --alarm-rule "{{ item.ansible_facts.composite_rule_for_region }}"
        --alarm-actions "arn:aws:sns:{{ item.item }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
        --ok-actions "arn:aws:sns:{{ item.item }}:{{ monitoring_account_id }}:{{ sns_topic_name }}"
  changed_when: true
  loop: "{{ composite_rule_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.skipped is not defined or not item.skipped
