---
cloudwatch_metrics_collection_interval_seconds: 60

# mount paths to monitor — add more per host/group if needed
cloudwatch_disk_monitor_paths:
  - "/"
  - "/data"
  - "/var"

cloudwatch_namespace: "DiskMonitoring"

disk_alert_warning_percent: 75
disk_alert_critical_percent: 85

cloudwatch_agent_config_path_linux: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
cloudwatch_agent_service_name_linux: amazon-cloudwatch-agent

# override this to an S3 VPC endpoint URL if instances have no public internet access
cloudwatch_agent_download_base: "https://amazoncloudwatch-agent.s3.amazonaws.com"
