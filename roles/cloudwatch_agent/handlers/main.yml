---
- name: restart cloudwatch agent linux
  # Restart via amazon-cloudwatch-agent-ctl to avoid the PolicyKit D-Bus
  # unavailability inside SSM shell sessions.
  # The config has already been applied by the task; we just need to cycle the service.
  ansible.builtin.command:
    cmd: >
      /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a stop
  become: true
  changed_when: false
  listen: restart cloudwatch agent linux

- name: restart cloudwatch agent windows
  ansible.windows.win_service:
    name: "{{ cloudwatch_agent_service_name_windows }}"
    state: restarted
  listen: restart cloudwatch agent windows
