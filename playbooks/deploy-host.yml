---
- name: check SSM is reachable
  hosts: "{{ target_host }}"
  gather_facts: false
  roles:
    - role: ssm_bootstrap
  post_tasks:
    - name: reset connection after SSM pre-flight (macOS fork-safety)
      meta: reset_connection

- name: install and configure CloudWatch Agent
  hosts: "{{ target_host }}"
  gather_facts: true
  roles:
    - role: cloudwatch_agent
