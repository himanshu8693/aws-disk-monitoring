# Multi-region single-account inventory.
# Any running EC2 instance with the DiskMonitoringInstanceProfile in ANY of the
# listed regions is automatically discovered and onboarded — no manual host list.
#
# The only per-region dependency is the SSM S3 bucket: each region needs its own
# bucket because the SSM connection plugin requires the bucket to be co-located.
# The correct bucket is derived at runtime from placement.region via the
# 'ssm_bucket_map' compose expression below.
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1
  - us-east-2
  - eu-west-1

filters:
  instance-state-name: running

keyed_groups:
  - key: tags['BusinessUnit'] | default('unassigned')
    prefix: bu
  - key: placement.region
    prefix: region

compose:
  ansible_aws_ssm_region: placement.region
  ansible_connection: "'amazon.aws.aws_ssm'"

  # Per-region SSM S3 bucket map — derived at runtime from placement.region.
  # Add a new entry here when onboarding a new region; no other change needed.
  ansible_aws_ssm_bucket_name: >-
    {
      'us-east-1': 'disk-monitoring-ssm-test-member-account1',
      'us-east-2': 'disk-monitoring-ssm-test-member-use2',
      'eu-west-1': 'disk-monitoring-ssm-test-member-euw1'
    }[placement.region]

  # ansible_host must be the EC2 instance ID for the SSM connection plugin.
  ansible_host: instance_id

  account_id: "'266349568266'"
  account_name: "'test-member-account1'"

  # Amazon Linux 2 ships Python 3.7; ansible-core 2.16 requires >= 3.8 on target.
  # python3.8 must be pre-installed: amazon-linux-extras install python3.8 -y
  ansible_python_interpreter: "'/usr/bin/python3.8'"

hostnames:
  - tag:Name
  - instance-id
