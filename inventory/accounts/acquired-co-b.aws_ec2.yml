# Member account: Acquired Co B
plugin: amazon.aws.aws_ec2

regions:
  - eu-west-1

assume_role_arn: arn:aws:iam::222222222222:role/DiskMonitoringAutomationRole

filters:
  instance-state-name: running

keyed_groups:
  - key: tags['BusinessUnit'] | default('unassigned')
    prefix: bu
  - key: platform | default('linux')
    prefix: os

compose:
  ansible_aws_ssm_region: placement.region
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_bucket_name: "'disk-monitoring-ssm-acquired-co-b'"
  account_id: "'222222222222'"
  account_name: "'acquired-co-b'"

hostnames:
  - tag:Name
  - instance-id
